name: CI/CD Pagos

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  IMAGE_NAME: duoc/casoejemplo-pagos
  IMAGE_TAG: ${{ github.sha }}

jobs:
  test:
    name: Pruebas y cobertura
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Configurar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Ejecutar pruebas y cobertura
        run: mvn -B verify

      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: reportes-de-calidad
          path: |
            target/site/jacoco/
            target/cucumber/
            target/surefire-reports/

  security:
    name: Análisis de seguridad
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Analizar dependencias con Snyk
        uses: snyk/actions/maven@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --fail-on=upgradable

  build:
    name: Construir imagen Docker
    needs: [test, security]
    runs-on: ubuntu-24.04
    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Construir imagen trazable
        run: docker build --tag "${IMAGE_NAME}:${IMAGE_TAG}" .

      - name: Verificar usuario no root
        run: |
          docker inspect --format='{{.Config.User}}' "${IMAGE_NAME}:${IMAGE_TAG}" | grep -Fx app

  deploy:
    name: Despliegue simulado
    needs: [test, security, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      IMAGE_NAME: duoc/casoejemplo-pagos
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Construir imagen para el stack
        run: docker build --tag "${IMAGE_NAME}:${IMAGE_TAG}" .

      - name: Inicializar Docker Swarm
        run: docker swarm init

      - name: Desplegar stack con dos réplicas
        run: docker stack deploy --compose-file docker-compose.yml pagos

      - name: Esperar réplicas disponibles
        shell: bash
        run: |
          for attempt in {1..18}; do
            replicas=$(docker service ls --filter name=pagos_pagos-svc --format '{{.Replicas}}')
            echo "Réplicas: ${replicas}"
            if [ "${replicas}" = "2/2" ]; then
              exit 0
            fi
            sleep 5
          done
          docker service ps pagos_pagos-svc
          exit 1

      - name: Esperar healthchecks del servicio
        shell: bash
        run: |
          for attempt in {1..30}; do
            containers=$(docker ps -q --filter label=com.docker.swarm.service.name=pagos_pagos-svc)
            healthy=0
            for container in ${containers}; do
              status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}starting{{end}}' "${container}")
              echo "${container}: ${status}"
              if [ "${status}" = "healthy" ]; then
                healthy=$((healthy + 1))
              fi
            done
            if [ "${healthy}" -eq 2 ]; then
              exit 0
            fi
            sleep 5
          done
          docker service ps --no-trunc pagos_pagos-svc
          docker ps --filter label=com.docker.swarm.service.name=pagos_pagos-svc
          exit 1

      - name: Verificar servicio desplegado
        shell: bash
        run: |
          containers=$(docker ps -q --filter label=com.docker.swarm.service.name=pagos_pagos-svc)
          verified=0
          for container in ${containers}; do
            echo "Verificando HTTP dentro del contenedor ${container}"
            if docker exec "${container}" wget -q -O /dev/null --timeout=10 http://127.0.0.1:8080/; then
              verified=1
              break
            fi
          done
          if [ "${verified}" -ne 1 ]; then
            echo "El servicio no respondió dentro de ningún contenedor saludable"
            exit 1
          fi

      - name: Diagnóstico del despliegue
        if: failure()
        run: |
          docker service ls
          docker service ps --no-trunc pagos_pagos-svc
          docker service logs --tail 200 pagos_pagos-svc || true

      - name: Mostrar trazabilidad
        run: |
          docker service ls
          docker service ps pagos_pagos-svc

      - name: Detener entorno simulado
        if: always()
        run: docker stack rm pagos
